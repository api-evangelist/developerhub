specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: DeveloperHub
providerId: developerhub
generated: '2026-09-06'
method: searched
source: https://developerhub.io/pricing
created: '2026-05-04'
modified: '2026-09-06'
currency: USD
billing:
  periods:
  - annual
  - monthly
  default: annual
  note: >-
    Headline prices are the annually-billed monthly rate; the monthly-billed rate is higher. The page
    states annual billing saves $360 a year.
trial:
  offered: true
  length_days: 14
  card_required: false
  note: >-
    Every paid plan starts with a 14-day trial, no card required, and the trial runs the real AI
    agent. A project that does not convert drops to Free rather than being deleted.
description: >-
  Published plans and pricing for the DeveloperHub.io documentation platform, read from the
  provider's own pricing page on 2026-09-06. DeveloperHub prices the whole platform, not API calls:
  no plan meters API requests, and the API's rate limits are per-operation rather than per-plan (see
  rate-limits/developerhub-rate-limits.yml). Plan boundaries that DO reach the API are capability
  gates — the OpenAPI marks export_project and get_audit_log as enterprise-only, and API references
  (and therefore the reference upload/publish operations) are unavailable on Free. This file
  replaces a 2026-05-04 scaffold whose tiers, quotas and overage prices were invented.
plan_count: 4
