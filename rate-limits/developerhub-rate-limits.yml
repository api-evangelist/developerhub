description: Published rate limits for the DeveloperHub.io v1 REST API. Every one of the 25 operations
  in the provider's own OpenAPI 1.1.0 states its own limit in its description, and every 2xx response
  declares the three X-RateLimit-* headers. Limits are per API key and per operation; there is no published
  per-plan rate table, and DeveloperHub gates capability by plan rather than by request rate. This file
  replaces a 2026-05-04 scaffold whose tier limits were invented.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
headerSemantics:
  X-RateLimit-Limit: 'Requests permitted until reset time (example: 300)'
  X-RateLimit-Remaining: 'Requests consumed in current period (example: 253)'
  X-RateLimit-Reset: 'Unix timestamp at which requests consumed will reset (example: 1611530395)'
headersObserved: declared in components.headers of the provider OpenAPI and referenced by every 2xx response
retryAfter: null
retryAfterNote: No Retry-After header is documented; clients back off using X-RateLimit-Reset.
responseCodes:
  throttled: 429
throttledBody:
  shape: '{"error":{"message":"You exceeded the rate limit","httpCode":429,"code":9}}'
  schema: TooManyRequests
  internalCode: 9
limit_count: 25
