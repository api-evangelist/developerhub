planLimits:
  published: false
  note: 'DeveloperHub publishes no per-plan request-rate table. Plan boundaries in the API are capability
    gates, not rate gates: export_project and get_audit_log are documented as "Only available in enterprise
    plans".'
enterpriseOnlyOperations:
- export_project
- get_audit_log
policies:
- name: Per-operation limits
  description: Each operation carries its own budget; there is no single account-wide rate.
- name: Signalling
  description: X-RateLimit-Limit / -Remaining / -Reset are returned on successful responses; exhaustion
    returns 429 with internal code 9.
