method: searched
source: >-
  https://docs.developerhub.io/api/ref (machine-readable at https://docs.developerhub.io/api.md),
  https://docs.developerhub.io/support-center/api-key ,
  https://docs.developerhub.io/support-center/editor-mcp-server ; live unauthenticated responses from
