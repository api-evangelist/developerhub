sdk_note: >-
  No first-party client library exists on npm, PyPI, RubyGems, Packagist, crates.io, Maven Central,
  NuGet or pkg.go.dev. No `SDKs` pointer is emitted for this provider, because emitting one would
  claim an SDK that does not exist.
