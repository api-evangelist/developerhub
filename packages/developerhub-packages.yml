summary: >-
  DeveloperHub publishes exactly one first-party package, and it is NOT a client library. There is no
  DeveloperHub SDK in any registry for any language: the documented way to call the v1 REST API is
  cURL with an X-Api-Key header, and the documented way to drive it from an agent is the hosted MCP
  servers. The one published package is an Agent Skills bundle that teaches a coding agent
  DeveloperHub's Markdoc dialect and repository layout.
package_count: 1
