- date: '2026-09-02'
  title: 2 September 2026
  link: https://docs.developerhub.io/product-updates?post=2-september-2026
  additions:
  - 'New GitHub Sync : Deleting a file from your repository no longer removes the content behind it for
    good. Pages are hidden, and versions, documentation sections and API references come off your site,
    but restoring the file within 30 days brings it all back where it was. See GitHub Sync .'
  improvements:
  - 'Improvement AI Assistant : Answers now link the pages they draw on, and opening one keeps the conversation
    beside it instead of reloading the site. See AI Assistant .'
  fixes: []
  breaking: []
