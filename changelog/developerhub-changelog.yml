  title: 26 August 2026
  link: https://docs.developerhub.io/product-updates?post=26-august-2026
  additions: []
  improvements:
  - 'Improvement Theme : A new project now starts on the light theme instead of the dark one. Projects
    you already have keep the theme they are on, and you can still switch either way from Project Settings
    → Customisation . See Theme .'
  fixes: []
  breaking: []
- date: '2026-08-25'
  title: 25 August 2026
  link: https://docs.developerhub.io/product-updates?post=25-august-2026
  additions:
  - 'New Integrations : DeveloperHub is now on the Zendesk Marketplace. Install DeveloperHub Docs and
    your support agents search your published documentation from the ticket sidebar, then drop a link
    to the matching page into their reply, without leaving the ticket. See Zendesk .'
  - 'New Import from Mintlify : Move a Mintlify site into DeveloperHub straight from its GitHub repository.
    Choose which versions and languages come over, and your pages, images and API references arrive with
    them. See Import from Mintlify .'
  improvements:
  - 'Improvement Import & Export : The pane is now two boards, Bring content in and Take content out .
    Every source sits at the same depth, so Markdoc, Markdown, Readme, Zendesk and Mintlify are each one
    click, and every row says what it needs from you before you open it. See Importing Documentation .'
  fixes:
  - 'Bug Fix PDF Export : A numbered list that carries on after an image, callout or code block keeps
    its numbering in the exported PDF.'
  breaking: []
- date: '2026-08-24'
  title: 24 August 2026
  link: https://docs.developerhub.io/product-updates?post=24-august-2026
  additions:
  - 'New Tables : A long table can pin its header row so it stays in view while the rest of it scrolls.
    Right-click a cell and select Pin header row while scrolling . See Tables .'
  - 'New Documentation Index : Move several entries at once. Click one, hold Shift and click another,
    and the whole run drags together. See Structuring Documentation .'
  improvements: []
  fixes: []
  breaking: []
- date: '2026-08-20'
  title: 20 August 2026
  link: https://docs.developerhub.io/product-updates?post=20-august-2026
  additions:
  - 'New Feedback : Ask the agent about your readers. It can now read the ratings and comments they left
    on your pages, and Analyse with AI in the feedback inbox opens it with the question ready to send.
    See Feedback and AI Agent .'
  - 'New AI Agent : The AI Editor shows the model your runs use beside your credit balance, and admins
    can select it to change it. See AI Agent .'
  - 'New Docs Digest : The broken links report has grown into the docs digest, one email covering broken
    links, searches that found nothing, reader feedback, drafts still unpublished and comments nobody
    has resolved. Each section opens AI Agent with the request already written, and admins pick how often '
  - 'New AI Agent : The agent can set a page''s search keywords, so the terms readers typed and found
    nothing for can be added to the page that should have answered them. See Page Keywords .'
  improvements:
  - 'Improvement AI Agent : The examples on a new conversation are selectable. Pick one to fill the message
    box, then send it as it is or edit it first.'
  - 'Improvement AI Agent : Remembered preferences are now remembered rules, and cover what to never do
    as well as what to always do, such as leaving a section alone or where to look first when a topic
    comes up. Ask the agent to drop one and it does. See AI Agent .'
  - 'Improvement Emails : Every email DeveloperHub sends has been redesigned on one shared layout, and
    now shows a written summary in your inbox instead of the first words of the body. Bold text, headings
    and links are legible in dark mode again.'
  - 'Improvement Self-Updating Docs : A Watch the setup video link on the settings pane walks through
    connecting a repository. See Self-Updating Docs .'
  fixes:
  - 'Bug Fix AI Agent : Asked to write up what shipped on a day your changelog already has a post for,
    the agent adds to that post instead of starting a second one. See Changelogs .'
  breaking: []
- date: '2026-08-19'
  title: 19 August 2026
  link: https://docs.developerhub.io/product-updates?post=19-august-2026
  additions:
  - 'New Project Settings : You can now take the version picker out of your published docs'' top navigation,
    so a project that only ever has one version doesn''t show a dropdown for it. Switch it on under Project
    Settings → Customisation → Look and feel , and the preview beside it shows the result before y'
  improvements: []
  fixes: []
  breaking: []
- date: '2026-08-18'
  title: 18 August 2026
  link: https://docs.developerhub.io/product-updates?post=18-august-2026
  additions:
  - 'New AI Agent : A run now keeps going while you are away. Come back to it and you rejoin the turn
    as it happens, with a Running tag marking it in your conversation list. See AI Agent .'
  - 'New Customisation : You can now publish your documentation without the DeveloperHub branding on it.
    Switch on Remove DeveloperHub branding under Project Settings → Customisation → Look and feel . See
    Customising Visuals .'
  - 'New AI Agent : Tell the agent a standing preference in a conversation, such as always using British
    spelling, and it remembers it for the project and follows it on every run. Take one back with Forget
    on the row that recorded it, or from the Remembered preferences card in settings. See AI Agent .'
  improvements:
  - 'Improvement Self-Updating Docs : You can leave the page while a newly added code repository is fetched.
    If the fetch fails, it stays attached and tells you why instead of disappearing. See Self-Updating
    Docs .'
  - 'Improvement Self-Updating Docs : The check on a pull request links to the run as soon as it starts,
    so you can follow the agent while it reads. See Checking pull requests .'
  - 'Improvement AI Agent : A reply now appears as it is written, thinking included, rather than behind
    a spinner. If the model you picked is busy, the run carries on with the closest one available and
    tells you so.'
  fixes:
  - 'Bug Fix Self-Updating Docs : The Branch row no longer goes blank when your repository''s default
    branch is not called main , and an attached repository stops reporting Cannot be read when it is perfectly
    readable.'
  - 'Bug Fix Reader : Headings on your published pages are links again. Select one to jump to that section
    and get a link straight to it.'
