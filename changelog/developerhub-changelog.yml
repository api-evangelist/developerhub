- date: '2026-08-30'
  title: 30 August 2026
  link: https://docs.developerhub.io/product-updates?post=30-august-2026
  additions:
  - 'New AI Agents : An assistant fetching one of your pages because someone asked it about your docs
    now reads the page as markdown rather than the app shell, and a documentation section''s URL answers
    with the pages inside it. It rides the Enable llms.txt setting you already have. See llms.txt .'
  improvements: []
  fixes:
  - 'Bug Fix Editor : Opening a link to a project you are not a member of now tells you so and opens one
    of your own, instead of quietly opening a different project and then reporting the page as missing.'
  breaking: []
- date: '2026-08-29'
  title: 29 August 2026
  link: https://docs.developerhub.io/product-updates?post=29-august-2026
  additions:
  - 'New Organisation Settings : An organisation can now share its HEAD tags and its footer, not just
    its CSS. Write them once under Customisation , then turn on Use organisation HEAD tags or Use organisation
    footer in each project that should pick them up. See Organisation Settings .'
  improvements:
  - 'Improvement AI Agent : The agent can now find where a class or function is defined in your attached
    code, not only where it is mentioned. See Self-Updating Docs .'
  fixes: []
  breaking: []
