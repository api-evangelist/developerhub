aid: developerhub
name: DeveloperHub
description: >-
  DeveloperHub is a hosted developer documentation platform that enables teams
  to create beautiful API references, user guides, and knowledge bases. It
  features auto-generated API documentation from OpenAPI specifications,
  built-in versioning, full-text search, custom domains, and a WYSIWYG editor.
  DeveloperHub provides a complete developer portal solution with support for
  multiple documentation projects, custom branding, and SEO optimization. The
  platform is itself programmable: a published OpenAPI 3.2 contract covers 25
  operations for pages, versions, documentation sections, API references,
  reader access, project export and changelog posts, and two first-party remote
  MCP servers expose the same surface to agents — a read-only reader server on
  every customer's docs site and an OAuth-protected editor server.
