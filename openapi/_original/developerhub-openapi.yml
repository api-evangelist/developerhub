openapi: 3.2.0
info:
  title: API
  description: >-
    API to manage your %product% resources programmatically. Using these APIs, you are able to
    manage pages, integrate with CI/CD, and retrieve resources among other operations.
  contact: {}
  version: 1.1.0
servers:
  - url: 'https://api.developerhub.io/api/v1'
    variables: {}
paths:
  /page:
    get:
      tags:
        - Page
      summary: Get page by slug
      description: >
        Get a page by slugs and read its content in
        [Markdoc](https://docs.developerhub.io/support-center/exporting-documentation#markdoc)

        or a derived format. Rate limit: 60 in 1 minute.


        Either `version_id` or `version_slug` must be provided. Either `documentation_id` or
        `documentation_slug` must be provided.
      operationId: get_page
      parameters:
        - name: version_id
          in: query
          description: Version ID.
          required: false
          schema:
            type: integer
        - name: version_slug
          in: query
          description: Version Slug.
          required: false
          schema:
            type: string
        - name: documentation_id
          in: query
          description: Documentation ID.
          required: false
          schema:
            type: integer
        - name: documentation_slug
          in: query
          description: Documentation Slug.
          required: false
          schema:
            type: string
        - name: page_slug
          in: query
          description: Page Slug.
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Format type
          required: false
          schema:
            type: string
            default: markdoc
            enum:
              - markdoc
              - markdown
              - html
              - text
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/page/{id}':
    get:
      tags:
        - Page
      summary: Read page
      description: >-
        Read a page including its content in
        [Markdoc](https://docs.developerhub.io/support-center/exporting-documentation#markdoc) or a
        derived format. Rate limit: 600 in 1 minute.
      operationId: read_page
      parameters:
        - name: id
          in: path
          description: Page ID
          required: true
          schema:
            type: integer
        - name: format
          in: query
          description: Format type
          required: false
          schema:
            type: string
            default: markdoc
            enum:
              - markdoc
              - markdown
              - html
              - text
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
    put:
      tags:
        - Page
      summary: Update a page
      description: 'Updates a page title, slug or draft contents. Rate limit: 10800 in 1 hour.'
      operationId: update_page
      parameters:
        - name: id
          in: path
          description: Page ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Page object
              properties:
                title:
                  type: string
                  description: Title of the page
                  example: Getting Started
                slug:
                  type: string
                  description: Slug in the URL. Generated if it was not provided
                  example: getting-started
                content:
                  type: string
                  description: >-
                    Draft contents of the page in [Markdoc
                    format](https://docs.developerhub.io/support-center/exporting-documentation#markdoc)
                  example: |
                    Let's start here

                    ## Step 1
                    Welcome to **DeveloperHub**

                    {% callout type="info" title="Note" %}
                    Content is written in Markdoc.
                    {% /callout %}
                message:
                  type: string
                  description: Page history message
                  default: Updated using API
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '415':
          description: Unsupported content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedContentType'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
    delete:
      tags:
        - Page
      summary: Delete a page
      description: 'Deletes a page and removes it from the navigation index. Rate limit: 10800 in 1 hour.'
      operationId: delete_page
      parameters:
        - name: id
          in: path
          description: Page ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                description: Empty object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/documentation/{id}/page':
    post:
      tags:
        - Page
      summary: Create a page
      description: >-
        Creates a page with draft contents. To insert in a pre-existing category, set the
        `categoryTitle`. Rate limit: 10800 in 1 hour.
      operationId: create_page
      parameters:
        - name: id
          in: path
          description: Documentation ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Page object
              properties:
                title:
                  type: string
                  description: Title of the page
                  example: Getting Started
                slug:
                  type: string
                  description: Slug in the URL. Generated if it was not provided
                  example: getting-started
                content:
                  type: string
                  description: >-
                    Draft contents of the page in [Markdoc
                    format](https://docs.developerhub.io/support-center/exporting-documentation#markdoc)
                  example: |
                    Let's start here

                    ## Step 1
                    Welcome to **DeveloperHub**

                    {% callout type="info" title="Note" %}
                    Content is written in Markdoc.
                    {% /callout %}
                categoryTitle:
                  type: string
                  description: >-
                    To create the page inside a category, provide the pre-existing category title
                    here (case insensitive). The page is added after the category's existing pages.
                  example: Installation
                message:
                  type: string
                  description: Page history message
                  default: Created using API
              required:
                - title
                - content
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '415':
          description: Unsupported content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedContentType'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/page/{id}/publish':
    put:
      tags:
        - Page
      summary: Publish a page
      description: 'Publishes a page from its draft contents. Rate limit: 10800 in 1 hour.'
      operationId: publish_page
      parameters:
        - name: id
          in: path
          description: Page ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '415':
          description: Unsupported content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedContentType'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  /version:
    get:
      tags:
        - Version
      summary: Lists all project versions
      description: >-
        Lists all project versions that are accessible through the API Key. This will only list
        non-deleted versions. Rate limit: 60 in 60 minutes.
      operationId: list_versions
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Version'
                description: OK
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{id}':
    put:
      tags:
        - Version
      summary: Update a version
      description: >-
        Updates a version. Enables you to publish or unpublish a version. Rate limit: 3600 in 1
        hour.
      operationId: update_version
      parameters:
        - name: id
          in: path
          description: Version ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Version object
              properties:
                name:
                  type: string
                  description: Name of the version
                  example: v1.0
                slug:
                  type: string
                  description: Slug in the URL
                  example: v1.0
                published:
                  type: boolean
                  description: True if it can be viewed by readers
                  example: true
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '415':
          description: Unsupported content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedContentType'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{id}/clone':
    post:
      tags:
        - Version
      summary: Clone a version
      description: >-
        Copies a version into a new one: every documentation and page (published
        content and drafts), plus the version's API references, are duplicated and internal
        links are re-pointed at the copies. The clone is created unpublished and becomes the
        first version in the project; publish it with a follow-up version update. Rate limit:
        60 in 60 minutes.
      operationId: clone_version
      parameters:
        - name: id
          in: path
          description: ID of the version to clone
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the new version
                  example: v2.0
                slug:
                  type: string
                  description: >-
                    Slug in the URL. Derived from the name when omitted. Alphanumeric
                    characters and dashes only.
                  example: v2-0
      responses:
        '201':
          description: Created
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        '400':
          description: General Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '415':
          description: Unsupported content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedContentType'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{id}/documentation':
    get:
      tags:
        - Documentation
      summary: Lists documentation sections in a version
      description: 'Lists all documentation sections in a version. Rate limit: 60 in 60 minutes.'
      operationId: list_documentation
      parameters:
        - name: id
          in: path
          description: Version ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Documentation'
                description: OK
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{id}/report':
    get:
      tags:
        - Version
      summary: Get version content report
      description: >-
        Reports every page in the version with its creation and last-update details. Rate limit: 60
        in 60 minutes.
      operationId: get_version_report
      parameters:
        - name: id
          in: path
          description: Version ID
          required: true
          schema:
            type: integer
        - name: created_by_email
          in: query
          description: Only include pages created by the user with this email address
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionReportPage'
                description: OK
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{id}/broken-links':
    get:
      tags:
        - Version
      summary: Get broken links report
      description: >-
        Lists every broken or risky link found across the version's pages, each with its issue
        type, severity, and a human-readable explanation. Rate limit: 60 in 60 minutes.
      operationId: get_version_broken_links
      parameters:
        - name: id
          in: path
          description: Version ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrokenLink'
                description: OK
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/version/{versionId}/reference':
    post:
      tags:
        - Reference
      summary: Adds or updates a reference specification
      description: >-
        Adds or updates a reference specification in that version. If the reference title matches
        one that already existed, then it is updated. Rate limit: 300 in 60 minutes.
      operationId: add_reference
      parameters:
        - name: versionId
          in: path
          description: The version ID
          required: true
          style: simple
          schema:
            type: string
        - name: publish
          in: query
          description: >-
            Publish the specification immediately. Set to false to import it as a draft to be
            published later.
          required: false
          schema:
            type: boolean
            default: true
        - name: show_try_it_out
          in: query
          description: Enable the Try It Out console on the reference
          required: false
          schema:
            type: boolean
        - name: allow_download
          in: query
          description: Allow readers to download the specification
          required: false
          schema:
            type: boolean
        - name: expandable
          in: query
          description: Show the reference operations as expandable rows
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          multipart/form-data:
            encoding: {}
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  description: The API specification in OpenAPI 2/3 (Swagger) format
                  format: binary
        required: false
      responses:
        '201':
          description: Created
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
        '400':
          description: General Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/reference/{id}/definition':
    get:
      tags:
        - Reference
      summary: Read a reference specification
      description: >-
        Downloads the raw specification of an API reference in JSON or YAML. Rate limit: 600 in 1
        minute.
      operationId: read_reference_definition
      parameters:
        - name: id
          in: path
          description: Reference ID
          required: true
          schema:
            type: integer
        - name: draft
          in: query
          description: Read the draft specification instead of the published one
          required: false
          schema:
            type: boolean
            default: false
        - name: format
          in: query
          description: >-
            Format of the returned specification. `auto` returns it as originally uploaded; `json`
            and `yaml` convert it if needed.
          required: false
          schema:
            type: string
            default: auto
            enum:
              - auto
              - json
              - yaml
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                description: The specification as a JSON document
            text/yaml:
              schema:
                type: string
                description: The specification as a YAML document
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  '/reference/{id}/publish':
    put:
      tags:
        - Reference
      summary: Publish a reference draft
      description: >-
        Publishes the draft specification of an API reference. Fails if the reference has no draft.
        Rate limit: 300 in 60 minutes.
      operationId: publish_reference
      parameters:
        - name: id
          in: path
          description: Reference ID
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Published
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reference'
        '400':
          description: General Exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDenied'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
      deprecated: false
  /export:
    get:
      tags:
        - Project
      summary: Exports project
      description: >-
        Exports the project into a ZIP file of Markdoc or Markdown files. Only available for
        enterprise plans. Rate limit: 10 in 60 minutes.
      operationId: export_project
      parameters:
        - name: format
          in: query
          description: Format of the exported page files.
          required: false
          schema:
            type: string
            default: markdoc
            enum:
              - markdoc
              - markdown
        - name: version_slug
          in: query
          description: Export only the version with this slug. Omit to export all versions.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
