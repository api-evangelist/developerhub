- feature: api-reference
  check: console_or_sandbox
  layer: composite
  provider_must: Declare the try-it playground as a Console or Playground entry.
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
- feature: changelogs
  check: change_log_present
  layer: composite
  provider_must: Maintain the changelog and declare it as a ChangeLog entry.
  catalog_pass_rate: 0.157
  facet: operational_transparency
  points: 6
