# Vendor facets — DeveloperHub. A hosted docs and developer-portal platform: an OpenAPI reference
# with try-it, guides, changelogs, versioning, landing pages and AI tooling, server-side rendered.
# The headline: solid portal pointers and an auto-generated llms.txt. Its MCP server is for
# AUTHORS editing docs from Claude, Cursor or Codex, not for agents calling the API, so it earns
# nothing on mcp_server.
vendor: developerhub
name: DeveloperHub
website: https://developerhub.io
areas:
- developer-portal
registry_keys:
- developerhub
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  DeveloperHub lifts the portal pointers: portal, documentation, API reference, changelog and a try-it
  console, each once declared in apis.yml. It renders server-side, so pages are readable without JavaScript,
  which avoids the SPA-shell trap that hides other portals. Its llms.txt is generated automatically, refreshes
  every six hours and cannot be edited (llms-full.txt is not supported). It counts only when served on
  the provider's own domain. Its MCP server is an authoring tool, so a provider on DeveloperHub has no
  reader-facing MCP server from it. Nothing here writes to the contract: the reference renders whatever
  examples and errors the OpenAPI has.
features:
- id: api-reference
  name: API reference from OpenAPI with try-it
  description: A reference generated from OpenAPI with a request playground supporting auth and OAuth
    2.0.
  source: https://developerhub.io/
  tier: all
- id: guides
  name: Guides and product documentation
  description: >-
    Authored guides with versioning, localization, a block-based landing page designer and GitHub two-way
    sync.
  source: https://developerhub.io/
  tier: all
- id: changelogs
  name: Changelogs
  description: Changelog pages as part of the docs project.
  source: https://developerhub.io/
  tier: all
- id: ssr-hosting
  name: Server-side rendering on a custom domain or subdirectory
  description: >-
    Docs are server-rendered and can be hosted on a custom domain or under a subdirectory behind a reverse
    proxy.
  source: https://docs.developerhub.io/support-center/hosting
  tier: all
- id: llms-txt
  name: Auto-generated llms.txt and Markdown pages
  description: >-
    Generates /llms.txt at the project base path every six hours (no llms-full.txt), and serves page Markdown
    at a .md suffix when enabled.
  source: https://docs.developerhub.io/support-center/llms-txt
  tier: all
- id: authoring-mcp
  name: MCP server for authoring
  description: >-
    Connects Claude, Cursor or Codex to the docs project so writers can read and write documentation from
    those tools.
  source: https://developerhub.io/ai
  tier: unknown
- id: ai-assistant
  name: AI Assistant for readers
  description: Reader-facing answers cited from the project's own pages.
  source: https://developerhub.io/ai
  tier: unknown
