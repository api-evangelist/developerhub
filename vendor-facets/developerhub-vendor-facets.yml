- feature: llms-txt
  check: llms_txt_published
  layer: composite
  conditional: true
  condition: >-
    Only when the project is served on the provider's own domain (a custom domain or a subdirectory).
    The file sits at the project URL, and on a DeveloperHub-hosted URL it is not the provider's surface.
  note: >-
    It is generated from the provider's own docs and cannot be edited. On the provider's domain, format
    rule 2 credits it in full.
  catalog_pass_rate: 0.351
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.65
earns_nothing:
- feature: authoring-mcp
  check: mcp_server
  layer: agent_readiness
  why: >-
    The server lets writers edit docs from an AI client. It does not expose the provider's API to agents.
- feature: ai-assistant
  check: agent_skills
  layer: agent_readiness
  why: A reader chat assistant is not a skills artifact.
- feature: api-reference
  check: examples_present
  why: The reference renders the examples the OpenAPI already has and adds none.
out_of_reach:
  checks:
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - contract_present
  - overlay_published
  - status_page_present
  - rate_limits_documented
  - well_known_published
  - spec_presence
  note: >-
    A docs platform renders the contract. It does not generate SDKs or CLIs, or write, host or improve
    the OpenAPI.
unscored_practice:
- feature: llms-txt
  why: >-
    Per-page Markdown twins (.md) served to AI assistants while crawlers get HTML. The rubric has no markdown-twin
    check.
